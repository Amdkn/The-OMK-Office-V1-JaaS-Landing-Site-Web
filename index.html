    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('omk-theme');
          if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'glassmorphism');
          }
        } catch(e) {}
      })();
    </script>
